name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            main.js manifest.json styles.css \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
